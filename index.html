<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c97b7b">
  <title>Alan🌷Ting · Shared Memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Noto+Serif+TC:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="loginScreen" class="login-screen" aria-labelledby="loginTitle">
    <div class="petals-bg" aria-hidden="true">🌸 🌷 🌺</div>
    <h1 id="loginTitle" class="login-title">Alan🌷Ting</h1>
    <p class="login-sub">A shared collection of sweet memories</p>
    <button class="btn btn-primary btn-google" id="btnSignIn" type="button">
      <span aria-hidden="true">✦</span> 用 Google 帳號登入
    </button>
    <p id="loginMessage" class="login-message" role="status" aria-live="polite">
      登入後即可開啟你們的共用相簿。
    </p>
  </main>

  <div id="app" class="app-shell" hidden>
    <nav id="sidebar" class="sidebar" aria-label="相簿導覽">
      <div class="sidebar-header">
        <div class="sidebar-logo">Alan🌷Ting <span>Shared Memories</span></div>
        <div class="user-chip">
          <img id="userAvatar" src="" alt="" width="32" height="32">
          <span id="userName">已登入</span>
        </div>
      </div>

      <section class="albums-scroll" aria-labelledby="albumHeading">
        <h2 id="albumHeading" class="section-label">相簿</h2>
        <div id="albumsList"></div>
      </section>

      <div class="sidebar-actions">
        <button class="btn btn-outline btn-block" id="btnNewAlbum" type="button">＋ 新增相簿</button>
        <button class="btn btn-ghost btn-block" id="btnChooseFolder" type="button">選擇共用資料夾</button>
        <button class="btn btn-ghost btn-block" id="btnResetFolder" type="button">重新設定資料夾</button>
      </div>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-block" id="btnSignOut" type="button">登出</button>
      </div>
    </nav>

    <section id="main" class="main-content">
      <header class="topbar">
        <button class="hamburger" id="hamburger" type="button" aria-label="開啟相簿選單" aria-controls="sidebar" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-copy">
          <h2 id="topbarTitle" class="topbar-title">所有回憶</h2>
          <p id="topbarSub" class="topbar-sub"></p>
        </div>
        <button class="btn btn-primary btn-upload" id="btnUpload" type="button">🌸 上傳</button>
        <input class="file-input-hidden" type="file" id="fileInput" accept="image/*,video/*" multiple>
      </header>

      <section id="folderSetup" class="folder-setup" aria-labelledby="folderSetupTitle" hidden>
        <div class="setup-icon" aria-hidden="true">🗂️</div>
        <h2 id="folderSetupTitle">選擇你們的共用資料夾</h2>
        <p id="folderSetupMessage">第一次使用時，請選取你和女友共同分享的 Google Drive 資料夾。</p>
        <p class="folder-current">目前資料夾：<strong id="folderName">尚未選擇</strong></p>
        <button class="btn btn-primary" id="folderSetupChoose" type="button">開啟 Google Picker</button>
      </section>

      <section class="content" aria-live="polite">
        <div class="stats-row" id="statsRow"></div>
        <div class="media-grid" id="mediaGrid">
          <div class="state-card"><span class="spinner" aria-hidden="true"></span><span>準備載入相簿⋯</span></div>
        </div>
      </section>
    </section>

    <div id="progressBar" class="progress-bar" role="status" aria-live="polite" hidden>
      <span aria-hidden="true">🌸</span>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <span id="progressLabel">0 / 0</span>
    </div>
  </div>

  <div id="dropOverlay" class="drop-overlay" hidden>
    <div class="drop-box"><div class="drop-icon" aria-hidden="true">🌸</div>放開以上傳到這個相簿</div>
  </div>

  <div id="captionOverlay" class="overlay" hidden>
    <section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="captionTitle">
      <h2 id="captionTitle">為這個檔案加上標題 ♡</h2>
      <img id="captionPreview" class="caption-preview" src="" alt="" hidden>
      <label for="captionInput">標題</label>
      <input id="captionInput" type="text" maxlength="60" placeholder="例：第一次看海 🌊">
      <label for="dateInput">日期</label>
      <input id="dateInput" type="date">
      <label for="noteInput">備忘（選填）</label>
      <textarea id="noteInput" rows="3" placeholder="那天的天空很藍⋯⋯"></textarea>
      <div class="modal-actions">
        <button class="btn btn-outline" id="captionSkip" type="button">略過</button>
        <button class="btn btn-primary" id="captionSave" type="button">儲存 💾</button>
      </div>
    </section>
  </div>

  <div id="newAlbumOverlay" class="overlay" hidden>
    <section class="modal-box compact" role="dialog" aria-modal="true" aria-labelledby="albumTitle">
      <h2 id="albumTitle">建立新相簿 🌷</h2>
      <label for="albumNameInput">相簿名稱</label>
      <input id="albumNameInput" type="text" maxlength="80" placeholder="例：京都之旅、第一個週年">
      <div class="modal-actions">
        <button class="btn btn-outline" id="albumCancel" type="button">取消</button>
        <button class="btn btn-primary" id="albumCreate" type="button">建立 ✨</button>
      </div>
    </section>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" id="lbClose" type="button" aria-label="關閉媒體檢視">✕</button>
    <button class="lightbox-nav lb-prev" id="lbPrev" type="button" aria-label="上一個">‹</button>
    <div class="lightbox-stage">
      <p id="lbLoading" class="lightbox-loading" role="status" aria-live="polite" hidden>載入中⋯</p>
      <img id="lbMedia" src="" alt="" hidden>
      <video id="lbVideo" controls playsinline preload="none" hidden></video>
      <p id="lbError" class="lightbox-error" role="alert" hidden>無法載入這個檔案。</p>
    </div>
    <button class="lightbox-nav lb-next" id="lbNext" type="button" aria-label="下一個">›</button>
    <div class="lightbox-copy">
      <h2 id="lbCaption" class="lb-caption"></h2>
      <p id="lbMeta" class="lb-meta"></p>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script async defer src="https://apis.google.com/js/api.js"></script>
  <script async defer src="https://accounts.google.com/gsi/client"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
